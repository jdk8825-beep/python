[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrail-analyzer"
version = "0.1.0"
description = "Scan AWS CloudTrail logs for suspicious activity and map findings to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cloudtrail-analyzer = "cloudtrail_analyzer.cli:main"

[tool.setuptools]
packages = ["cloudtrail_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
